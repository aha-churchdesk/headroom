name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon: the sampler reads macOS-only counters, and the e2e
    # tests drive real process groups and signals.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Rust as local, from mise.toml.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      # The UI tests run under plain node, which the runner image has.
      - run: mise exec -- rustup component add clippy rustfmt llvm-tools
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tests, lint and coverage gate
        run: ./scripts/test.sh --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/coverage-summary.txt ]; then
            { echo '### Coverage'; echo '```'; grep -E '^(Filename|TOTAL|core/|headroom/|headroomd/)' target/coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: ignore

      # Release build of both binaries, assembled into Headroom.app.
      - name: Bundle
        run: ./scripts/bundle.sh
