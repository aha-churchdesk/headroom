<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headroom</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Work Scheduler — menu bar popover UI
   Self-contained: no build step, no dependencies, no network.
   Runs standalone in a browser (POC mode) or embedded in wry.
   ───────────────────────────────────────────────────────────── */

:root{
  color-scheme: light dark;
  --pop-w: 400px;
  --pop-max-h: 640px;

  --bg:        #ffffff;
  --bg-elev:   #f2f2f7;
  --bg-sunk:   #e9e9ee;
  --text:      #1c1c1e;
  --text-dim:  #5b5b61;
  --text-faint:#64646a;
  --sep:       rgba(0,0,0,.10);
  --sep-soft:  rgba(0,0,0,.06);

  --accent:    #205fca;
  --good:      #086b46;
  --warn:      #865300;
  --bad:       #b42323;
  --ice:       #126b91;
  --track:     rgba(0,0,0,.07);

  --on-status: #ffffff;
  --warn-tint: #ece3d6;
  --bad-tint: #f3dcdc;
  --good-tint: #dceae4;
  --ice-tint: #d4e4eb;

  --radius: 10px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:        #1e1e20;
    --bg-elev:   #2c2c2e;
    --bg-sunk:   #151517;
    --text:      #f2f2f7;
    --text-dim:  #b0b0b6;
    --text-faint:#a5a5ac;
    --sep:       rgba(255,255,255,.13);
    --sep-soft:  rgba(255,255,255,.07);

    --accent:    #60a5fa;
    --good:      #34d399;
    --warn:      #fbbf24;
    --bad:       #f87171;
    --ice:       #7dd3fc;
    --track:     rgba(255,255,255,.09);
    --on-status: #1c1c1e;
    --warn-tint: #3f351e;
    --bad-tint: #412b2d;
    --good-tint: #213732;
    --ice-tint: #2f3f48;
  }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
}
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  font: 13px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
/* Paint the canvas so a rounding gap between 100vh and the window height
   shows the popover's own colour rather than WKWebView's white. */
html{ background: var(--bg); }

/* Standalone POC chrome — hidden when embedded in the real app */
body{
  background: var(--bg-sunk);
  min-height:100vh;
  display:flex; align-items:flex-start; justify-content:center;
  gap:24px; padding:28px 20px 60px;
}
body.live{ background:transparent; padding:0; display:block; }
body.live #poc, body.live #stage .menubar{ display:none; }

#poc{ width:212px; flex:0 0 auto; padding-top:4px; }
#poc h2{
  font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-faint); font-weight:600; margin:0 0 8px 2px;
}
#poc .st{
  display:block; width:100%; text-align:left; margin-bottom:4px;
  padding:7px 10px; border-radius:7px; border:1px solid transparent;
  background:transparent; color:var(--text-dim); cursor:pointer;
  font:inherit; font-size:12px;
}
#poc .st:hover{ background:var(--bg-elev); color:var(--text); }
#poc .st.on{ background:var(--bg); color:var(--text); border-color:var(--sep); font-weight:600; }
#poc .st small{ display:block; color:var(--text-faint); font-size:10.5px; font-weight:400; }
#poc .note{
  margin-top:14px; padding:10px; font-size:11px; line-height:1.5;
  color:var(--text-faint); border-top:1px solid var(--sep-soft);
}
#poc #sent{
  margin-top:6px; max-height:180px; overflow:auto;
  font: 10.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
  color:var(--text-dim); white-space:pre-wrap; word-break:break-all;
}

#stage{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
body.live #stage{ display:block; }

/* POC only: a strip standing in for the macOS menu bar, to review the item */
.menubar{
  align-self:stretch; height:24px; border-radius:6px;
  background:rgba(240,240,245,.85); color:#1c1c1e;
  display:flex; align-items:center; justify-content:flex-end; gap:14px;
  padding:0 10px; font-size:13px; border:1px solid var(--sep);
}
.menubar.dark{ background:rgba(40,40,44,.9); color:#f2f2f7; }
.menubar .item{ display:flex; align-items:center; gap:5px; padding:1px 6px; border-radius:4px; }
.menubar .item.open{ background:rgba(0,0,0,.12); }
.menubar.dark .item.open{ background:rgba(255,255,255,.18); }
.menubar .faux{ opacity:.45; font-size:12px; }
.menubar canvas{ display:block; }

/* ── The popover itself ───────────────────────────────────── */
.popover{
  width:var(--pop-w); max-height:var(--pop-max-h);
  background:var(--bg);
  border-radius:12px;
  border:1px solid var(--sep);
  box-shadow: 0 12px 40px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.10);
  display:flex; flex-direction:column; overflow:hidden;
}
body.live .popover{
  width:100%; max-height:none; height:100vh; border-radius:0; border:none; box-shadow:none;
}

button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
[data-act]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
button:disabled{ cursor:default; opacity:.4; }
.mono{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11.5px; }
.dim{ color:var(--text-dim); }
.faint{ color:var(--text-faint); }
.num{ font-variant-numeric:tabular-nums; }

/* ── Header ───────────────────────────────────────────────── */
.head{ padding:12px 14px 10px; border-bottom:1px solid var(--sep); flex:0 0 auto; }
.head .row1{ display:flex; align-items:center; gap:10px; }
.head .lbl{ font-size:11px; font-weight:600; color:var(--text-dim); width:52px; }
.memtrack{ flex:1; height:8px; border-radius:4px; background:var(--track); overflow:hidden; position:relative; }
.memtrack .fill{ position:absolute; inset:0 auto 0 0; border-radius:4px; }
.memtrack .reserve{
  position:absolute; top:0; bottom:0; right:0;
  background: repeating-linear-gradient(135deg, transparent 0 3px, var(--sep) 3px 5px);
}
.head .memtxt{ font-size:12px; font-weight:600; min-width:92px; text-align:right; }
.btn-hold{
  font-size:11px; font-weight:600; padding:3px 9px; border-radius:6px;
  border:1px solid var(--sep); background:var(--bg-elev);
}
.btn-hold.on{ background:var(--warn); border-color:transparent; color:var(--on-status); }
.head .row2{ display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11.5px; color:var(--text-dim); }
.level{ font-size:10.5px; font-weight:700; letter-spacing:.06em; }
.level.normal{ color:var(--good); }
.level.warn{ color:var(--warn); }
.level.critical{ color:var(--bad); }
/* One tooltip for every [data-tip], shown at once and kept inside the popover. */
.tip{
  position:fixed; z-index:20; max-width:240px; padding:5px 8px; border-radius:6px;
  background:var(--text); color:var(--bg); font-size:11px; line-height:1.35;
  pointer-events:none; opacity:0; transition:opacity .08s;
}
.tip.on{ opacity:1; }
[data-tip]{ cursor:default; }
.head .alert{
  margin-top:8px; font-size:11.5px; padding:6px 9px; border-radius:7px;
  background:var(--warn-tint);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.head .alert button{ font-size:11px; font-weight:600; color:var(--accent); white-space:nowrap; }

/* ── Scroll body ──────────────────────────────────────────── */
.body{ flex:1 1 auto; overflow:auto; min-height:0; }

/* Guard banners */
.banner{
  margin:10px 12px 0; padding:9px 11px; border-radius:var(--radius);
  font-size:12px; position:relative;
}
.banner.frozen{ background:var(--ice-tint); }
.banner.requeued{ background:var(--warn-tint); }
.banner.gave_up{ background:var(--bad-tint); }
.banner .t{ font-weight:600; padding-right:18px; }
.banner .d{ color:var(--text-dim); font-size:11.5px; margin-top:1px; }
.banner .acts{ display:flex; gap:6px; margin-top:7px; }
.banner .x{ position:absolute; top:6px; right:8px; color:var(--text-dim); font-size:12px; }
.chip-btn{
  font-size:11px; font-weight:600; padding:3px 10px; border-radius:6px;
  background:var(--bg); border:1px solid var(--sep);
}
.chip-btn.danger{ color:var(--bad); }
.chip-btn.confirm{ background:var(--bad); color:var(--on-status); border-color:transparent; }

/* Sections */
.sec{ padding:10px 0 4px; }
.sec + .sec{ border-top:1px solid var(--sep-soft); }
.sec-h{
  display:flex; align-items:baseline; gap:8px; padding:0 14px 5px;
  font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--text-dim);
}
.sec-h .why{ text-transform:none; letter-spacing:0; font-weight:500; font-size:11.5px; color:var(--text-dim); }
.sec-h .why.blocked{ color:var(--warn); }
.day-row{ display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); margin:0 14px 6px; }
.day-row.five{ grid-template-columns:repeat(5, minmax(0, 1fr)); }
.day-row > div{ display:flex; flex-direction:column; gap:1px; padding:2px 7px; min-width:0; }
.day-row > div:first-child{ padding-left:0; }
.day-row > div + div{ border-left:1px solid var(--sep-soft); }
.day-row b{ font-size:14px; font-weight:650; }
.day-row span{ font-size:10px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.day-row .zero b{ color:var(--text-faint); font-weight:500; }
.empty{ padding:6px 14px 10px; color:var(--text-faint); font-size:12px; }

/* Job rows */
.job{ padding:7px 14px 8px; position:relative; }
.job:hover{ background:var(--bg-elev); }
/* Removed rows are visual copies, clipped to the scrolling task list. */
#view{ position:relative; }
.task-exits{ position:absolute; overflow:hidden; pointer-events:none; z-index:1; }
.task-exits .job{ position:absolute; margin:0; pointer-events:none; background:var(--bg); }
.job .l1{ display:flex; align-items:baseline; gap:6px; min-width:0; }
.job .name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.job .name b{ font-weight:600; }
.job .name.two{ display:flex; flex-direction:column; gap:1px; }
.job .name.two > *{ overflow:hidden; text-overflow:ellipsis; }
.job .name .job-title{ display:flex; align-items:center; gap:5px; min-width:0; }
.job-title b{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.job-origin{ flex:0 1 auto; max-width:50%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:9.5px; font-weight:500; color:var(--text-dim); background:var(--bg-sunk); border-radius:4px; padding:0 4px; }
.job .name.two .cmd{ font-size:11.5px; }
.job .now{ margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11px; color:var(--text-faint); font-family:ui-monospace, "SF Mono", Menlo, monospace; }
/* Queued rows: the estimate, then how long it has waited, beside the two-line name. */
.job .mem.two{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.job .name .cmd{ color:var(--text-dim); }
.job .mem{ font-size:11.5px; color:var(--text-dim); white-space:nowrap; }
.job .mem b{ color:var(--text); font-weight:600; }
.job .mem .new{
  font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:0 5px; border-radius:4px; background:var(--bg-sunk); color:var(--text-dim); margin-right:3px;
}
.job .l2{ display:flex; flex-wrap:wrap; align-items:center; gap:5px 9px; margin-top:5px; font-size:11px; color:var(--text-dim); }
.job .l2 .meta{ white-space:nowrap; }
.job .l2 .acts-i{ margin-left:auto; }
.tag{ font-size:12px; }

.memory{ margin-top:8px; }
.past-peaks{ display:block; margin-top:4px; font-size:10.5px; color:var(--text-dim); }
.fp{ height:6px; border-radius:3px; background:var(--track); position:relative; }
.fp .f{ position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--accent); }
.fp.has-range{ height:16px; background:transparent; }
.fp.has-range::before{ content:""; position:absolute; inset:auto 0 0; height:6px; border-radius:3px; background:var(--track); }
.fp.has-range .f{ top:auto; height:6px; }
/* Keep past peaks on a separate rail so the live fill cannot hide them. */
.fp .range{ position:absolute; top:0; height:5px; min-width:2px; border:1px solid var(--text-dim); background:var(--bg-elev); }
.fp.over .f{ background:var(--warn); }
.fp.runaway .f{ background:var(--bad); }
.fp.frozen .f{
  background: repeating-linear-gradient(135deg, var(--ice) 0 4px, var(--ice-tint) 4px 8px);
}
.fp .tick{ position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--text); border-radius:1px; }

.acts-i{ display:flex; gap:2px; }
.ib{
  width:22px; height:20px; border-radius:5px; font-size:11px; line-height:20px; text-align:center;
  color:var(--text-dim);
}
.ib:hover{ background:var(--bg-sunk); color:var(--text); }
.ib.on{ color:var(--text); background:var(--bg-sunk); }
.ib.kill-confirm{ width:auto; padding:0 7px; background:var(--bad); color:var(--on-status); font-weight:600; }
/* Queued rows swap the estimate for their actions on hover, so the name
   keeps the full width the rest of the time. */
.job.queued .acts-i{ display:none; }
.job.queued:hover .acts-i, .job.queued:focus-within .acts-i, .job.queued.restoring-focus .acts-i, .job.queued.expanded .acts-i{ display:flex; }
.job.queued:hover .mem, .job.queued:focus-within .mem, .job.queued.restoring-focus .mem, .job.queued.expanded .mem{ display:none; }
/* Emoji toggles are coloured either way; mute the off state so on reads as on. */
.ib:not(.on) .emo{ filter:grayscale(1); opacity:.55; }

.job.queued .l1{ align-items:center; }
.handle{ color:var(--text-faint); cursor:grab; width:14px; text-align:center; font-size:12px; user-select:none; }
.pos{ color:var(--text-faint); font-size:11px; width:12px; text-align:right; }
.job.dragging{ opacity:.35; }
.job.drop-before{ box-shadow: inset 0 2px 0 var(--accent); }
.job.drop-after{ box-shadow: inset 0 -2px 0 var(--accent); }

.detail{
  margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--bg-sunk);
  display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:11px;
}
.detail .k{ color:var(--text-dim); }
.detail .v{ overflow-wrap:anywhere; }
.detail .full{ grid-column:1 / -1; display:flex; gap:6px; margin-top:4px; }

/* Footer nav */
.foot{
  flex:0 0 auto; display:flex; border-top:1px solid var(--sep);
}
.foot button{ flex:1; padding:9px 0; font-size:12px; color:var(--text-dim); }
.foot button:hover{ background:var(--bg-elev); color:var(--text); }
.foot button + button{ border-left:1px solid var(--sep-soft); }

/* Drill-in pages */
.pagehead{
  display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--sep-soft);
  position:sticky; top:0; background:var(--bg); z-index:1;
}
.pagehead .back{ color:var(--accent); font-size:12.5px; }
.pagehead h1{ font-size:13px; font-weight:650; flex:1; text-align:center; margin-right:44px; }

.hrow{ padding:7px 14px; cursor:pointer; }
.hrow:hover{ background:var(--bg-elev); }
.hrow .l1{ display:flex; gap:6px; align-items:baseline; }
.hrow .l1 .name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hrow .l2{ font-size:11px; color:var(--text-dim); margin-top:1px; }
.gtag{
  font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:1px 6px; border-radius:4px; white-space:nowrap;
}
.gtag.ok{ color:var(--good); background:var(--good-tint); }
.gtag.fail{ color:var(--bad); background:var(--bad-tint); }
.gtag.guard{ color:var(--on-status); background:var(--warn); }
.gtag.user{ color:var(--text-dim); background:var(--bg-sunk); }

.cmd-ctl{ display:flex; justify-content:space-between; gap:8px; padding:10px 14px 8px; }
.cmd-total{ padding-top:2px; border-bottom:1px solid var(--sep-soft); }
.crow .l1 .n{ white-space:nowrap; font-size:11.5px; color:var(--text-dim); }
.crow .l1 .n b{ color:var(--text); font-weight:600; }
.crow .cbar{ height:3px; border-radius:2px; background:var(--track); margin:4px 0 3px; }
.crow .cbar i{ display:block; height:100%; border-radius:2px; background:var(--accent); }
.cmd-note{ padding:8px 14px 12px; font-size:11px; color:var(--text-faint); }
.prof{ padding:12px 14px; }
.prof .parts{ margin-top:14px; }
.prof .parts > .k{ font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--text-dim); margin-bottom:4px; }
.prof .part{ padding:5px 0; border-top:1px solid var(--sep-soft); }
.prof .part .mono{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prof .part .dim{ font-size:11px; margin-top:1px; }
.prof .key{ font-size:11.5px; color:var(--text-dim); word-break:break-all; }
.prof svg{ display:block; margin:12px 0 4px; width:100%; height:64px; }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
.stat{ background:var(--bg-elev); border-radius:8px; padding:7px 9px; }
.stat .k{ font-size:10.5px; color:var(--text-dim); }
.stat .v{ font-size:14px; font-weight:650; }

.orow{ padding:7px 14px; }
.orow .l1{ display:flex; gap:8px; align-items:baseline; }
.orow .l1 .name{ flex:1; }
.orow .bar{ height:4px; border-radius:2px; background:var(--track); margin-top:4px; }
.orow .bar div{ height:100%; border-radius:2px; background:var(--text-faint); }
.orow .l1 .name{ cursor:pointer; }
.orow .l1 .name::before{ content:"▸ "; color:var(--text-faint); }
.orow.open .l1 .name::before{ content:"▾ "; }
.ototal{ display:flex; align-items:baseline; gap:8px; padding:4px 14px 10px; border-bottom:1px solid var(--sep); }
.ototal b{ font-size:15px; }
.ototal .sep{ width:10px; }
.odetail{ margin:6px 0 2px 12px; font-size:11px; }
.odetail .where{ color:var(--text-faint); word-break:break-all; }
.oproc{ padding:6px 0 0; border-top:1px solid var(--sep); margin-top:6px; }
.oproc .l1{ display:flex; gap:8px; }
.oproc .cmd{ word-break:break-all; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.oproc .k{ color:var(--text-dim); margin-top:2px; word-break:break-all; }
.note-foot{ padding:10px 14px 14px; font-size:11px; color:var(--text-faint); }

.set{ padding:10px 14px; border-bottom:1px solid var(--sep-soft); }
.set .k{ font-weight:600; font-size:12.5px; }
.set .h{ font-size:11px; color:var(--text-dim); margin-top:2px; }
.set .ctl{ margin-top:7px; display:flex; align-items:center; gap:8px; }
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--sep); border-radius:7px; overflow:hidden; }
.stepper button{ width:26px; height:24px; font-size:14px; color:var(--text-dim); }
.stepper button:hover{ background:var(--bg-elev); color:var(--text); }
.stepper span{ min-width:64px; text-align:center; font-weight:600; font-size:12px; border-left:1px solid var(--sep-soft); border-right:1px solid var(--sep-soft); line-height:24px; }
.seg{ display:inline-flex; background:var(--bg-sunk); border-radius:7px; padding:2px; }
.seg button{ padding:3px 10px; border-radius:5px; font-size:11.5px; color:var(--text-dim); white-space:nowrap; }
.seg button.on{ background:var(--bg); color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12); }
.toggle{ flex:0 0 auto; width:34px; height:20px; border-radius:10px; background:var(--bg-sunk); position:relative; border:1px solid var(--sep); }
.toggle::after{ content:""; position:absolute; top:1px; left:1px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s; }
.toggle.on{ background:var(--good); border-color:transparent; }
.toggle.on::after{ left:15px; }
.pats{ margin-top:7px; display:flex; flex-wrap:wrap; gap:4px; }
.pat{ display:inline-flex; align-items:center; gap:4px; padding:2px 4px 2px 7px; border-radius:5px; background:var(--bg-elev); }
.pat button{ color:var(--text-faint); font-size:10px; padding:0 3px; }
.pat button:hover{ color:var(--bad); }
.pat.excl{ background:transparent; border:1px dashed var(--sep); color:var(--text-dim); }
input.txt{
  flex:1; font:inherit; font-size:12px; padding:4px 8px; border-radius:6px;
  border:1px solid var(--sep); background:var(--bg); color:var(--text); outline:none; min-width:0;
}
input.txt:focus{ border-color:var(--accent); }
.verdict{ margin-top:6px; font-size:11.5px; }
.verdict.yes{ color:var(--good); }
.verdict.no{ color:var(--text-dim); }
.verdict.excl{ color:var(--warn); }
pre.snip{
  margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--bg-sunk);
  font: 10.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space:pre; overflow:auto;
}
.agent{ margin-top:7px; }
.agent .an{ font-weight:600; font-size:12px; margin-right:6px; }
.agent .h{ margin-top:1px; }
.quit{ padding:12px 14px 16px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-faint); }
</style>
</head>
<body>

<div id="poc">
  <h2>Prototype</h2>
  <div id="stateList"></div>
  <div class="note">
    Standalone preview. The same file becomes the shipped UI —
    it detects <code>window.ipc</code> at runtime and switches to live data.
    <br><br>Add <code>?state=…</code> to the URL to deep-link a state.
    <br><br>
    <label><input type="checkbox" id="darkBar"> dark menu bar</label>
    <br><br><b>Would send to Rust</b>
    <div id="sent"></div>
  </div>
</div>

<div id="stage">
  <div class="menubar" id="menubar">
    <span class="faux">⌃</span><span class="faux">Wi-Fi</span>
    <span class="item open" id="trayItem"><canvas id="trayGlyph" width="36" height="32" style="width:18px;height:16px"></canvas><span id="trayTitle" class="num"></span></span>
    <span class="faux">Tue 09:42</span>
  </div>
  <div class="popover" id="pop">
    <header class="head" id="head" aria-label="Memory and queue status"></header>
    <main class="body" id="view" aria-labelledby="page-title"></main>
    <nav class="foot" id="foot" aria-label="Headroom pages"></nav>
    <div class="tip" id="tip"></div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   1. Runtime bridge
   Rust owns the facts and every decision (estimates, reasons,
   runaway thresholds); this file only formats and sends intents.
   ═══════════════════════════════════════════════════════════ */
const LIVE = !!window.ipc;
if (LIVE) document.body.classList.add("live");

/** Rust calls this on every sample (1 s): window.__setState({...}) */
window.__setState = (s) => { STATE = s; render(); };

function send(msg){
  if (LIVE) window.ipc.postMessage(JSON.stringify(msg));
  else mockApply(msg);
}

/* ═══════════════════════════════════════════════════════════
   2. Formatting
   ═══════════════════════════════════════════════════════════ */
const GiB = 1024 ** 3;
const gb = b => (b / GiB).toFixed(1).replace(/\.0$/, "");
/** Keep the workload fingerprint out of the human-readable command label. */
const keyLabel = k => String(k ?? "").split("|").filter(p => !/^v2:[a-f0-9]{64}$/.test(p)).map((p, i) => i === 0 ? p.split("/").filter(Boolean).pop() || p : p).join(" · ");
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function dur(s){
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m${String(s % 60).padStart(2, "0")}`;
  return `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`;
}
function ago(s){
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return `${Math.floor(s / 86400)} d ago`;
}

/** The queue header's one-line answer to "why is nothing starting?" */
function reasonText(r){
  if (!r) return "";
  switch (r.kind){
    case "memory":   return `next needs ${gb(r.need)} GB, ${gb(r.free)} GB free`;
    case "pressure": return `memory pressure ${r.level.toUpperCase()}`;
    case "cpu":      return `CPU busy, load ${r.load.toFixed(0)} / ${r.cores} cores`;
    case "held":     return "held by you";
    default:         return "";
  }
}

/* ═══════════════════════════════════════════════════════════
   3. UI-local state
   Navigation, expansion and confirm timers never go to Rust:
   they belong to this popover instance, not to the queue.
   ═══════════════════════════════════════════════════════════ */
let STATE = null;
const UI = {
  page: "main",           // main | history | commands | profile | others | settings
  profileKey: null,
  trail: [],             // Previous page, reader position, and the control that opened this page
  cmdDays: 7,             // Commands page: window in days, and the column it sorts by
  cmdSort: "run_s",
  expanded: new Set(),
  openApps: new Set(),    // Other apps rows showing their processes
  confirm: null,          // { key, until } — second click within 3 s acts
  drag: null,             // { id } while a queued row is being dragged
  drafts: { pattern: "", test: "" },
  snippet: false,
};

function armConfirm(key){
  UI.confirm = { key, until: Date.now() + 3000 };
  setTimeout(() => {
    if (UI.confirm && UI.confirm.key === key && Date.now() >= UI.confirm.until){
      UI.confirm = null; render();
    }
  }, 3050);
}
const confirming = key => UI.confirm && UI.confirm.key === key && Date.now() < UI.confirm.until;

/* ═══════════════════════════════════════════════════════════
   4. Render
   ═══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

const taskMotion = { page:null, key:null, animations:new Set(), exits:null };
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

function clearTaskMotion(){
  taskMotion.animations.forEach(animation => animation.cancel());
  taskMotion.animations.clear();
  taskMotion.exits?.remove();
  taskMotion.exits = null;
}
reducedMotion.addEventListener?.("change", () => {
  if (reducedMotion.matches) clearTaskMotion();
});

function animateTask(row, frames, exiting = false){
  const animation = row.animate(frames, { duration:exiting ? 180 : 200, easing:"cubic-bezier(.2,.7,.2,1)" });
  taskMotion.animations.add(animation);
  animation.onfinish = () => {
    taskMotion.animations.delete(animation);
    if (exiting){
      row.remove();
      if (!taskMotion.exits?.childElementCount){
        taskMotion.exits?.remove();
        taskMotion.exits = null;
      }
    }
  };
}

function animateTaskChanges(view, before){
  const after = new Map([...view.querySelectorAll(".job[data-job-id]")]
    .map(row => [row.dataset.jobId, row]));
  after.forEach((row, id) => {
    const old = before.get(id);
    if (!old){
      animateTask(row, [{ opacity:0, transform:"translateY(6px)" }, { opacity:1, transform:"none" }]);
    } else {
      const rect = row.getBoundingClientRect();
      const dy = old.rect.top - rect.top;
      if (Math.abs(dy) > .5) animateTask(row, [{ transform:`translateY(${dy}px)` }, { transform:"none" }]);
    }
  });
  const removed = [...before].filter(([id]) => !after.has(id));
  if (!removed.length) return;

  const bounds = view.getBoundingClientRect();
  const layer = document.createElement("div");
  layer.className = "task-exits";
  layer.setAttribute("aria-hidden", "true");
  layer.setAttribute("inert", "");
  layer.style.cssText = `left:0;top:${view.scrollTop}px;width:${view.clientWidth}px;height:${view.clientHeight}px`;
  taskMotion.exits = layer;
  view.append(layer);
  removed.forEach(([, old]) => {
    const row = old.row.cloneNode(true);
    // Copies must never enter delegated actions, drag targets or focus lookup.
    [row, ...row.querySelectorAll("*")].forEach(el => {
      [...el.attributes].forEach(attr => {
        if (attr.name.startsWith("data-") || ["id", "tabindex", "draggable"].includes(attr.name)) el.removeAttribute(attr.name);
      });
    });
    row.style.cssText = `left:${old.rect.left - bounds.left}px;top:${old.rect.top - bounds.top}px;width:${old.rect.width}px;height:${old.rect.height}px`;
    layer.append(row);
    animateTask(row, [{ opacity:1, transform:"none" }, { opacity:0, transform:"translateX(-6px)" }], true);
  });
}

// Values and toggle states change on each reply; the action itself stays put.
function controlKey(el){
  const d = el.dataset;
  return JSON.stringify([d.act, d.id, d.key, d.name, d.page, d.pattern, d.confirm, d.step, d.run,
    d.act === "set" && d.key !== "kill_mode" ? null : d.val]);
}
const controlsWithKey = key => [...document.querySelectorAll("[data-act]")]
  .filter(el => controlKey(el) === key);

function navigate(page, trigger, back = false){
  const saved = back ? UI.trail.pop() : null;
  if (!back){
    const key = trigger?.dataset?.act ? controlKey(trigger) : null;
    UI.trail.push({ page:UI.page, profileKey:UI.profileKey, scroll:$("view").scrollTop,
      control:key, occurrence:key ? Math.max(0, controlsWithKey(key).indexOf(trigger)) : 0 });
  }
  UI.page = saved?.page || page;
  if (saved) UI.profileKey = saved.profileKey;
  render(saved || { scroll:0 });
}

function render(destination = null){
  if (!STATE) return;
  // Updates arrive every second. A rerender mid-drag would drop the drag, so
  // defer it; the drop sends its own intent and the next tick catches up.
  if (UI.drag) return;

  const view = $("view");
  clearTaskMotion();
  // Task identities and section order survive the full HTML replacement.
  // Telemetry, expansion and navigation must not replay row animations.
  const taskKey = JSON.stringify([STATE.running.map(j => j.id), STATE.queued.map(j => j.id)]);
  const before = !destination && UI.page === "main" && taskMotion.page === "main"
    && taskMotion.key !== taskKey && !reducedMotion.matches && typeof view.animate === "function"
    ? new Map([...view.querySelectorAll(".job[data-job-id]")]
        .map(row => [row.dataset.jobId, { row, rect:row.getBoundingClientRect() }])) : null;
  taskMotion.page = UI.page;
  taskMotion.key = taskKey;
  const scroll = view.scrollTop;
  const focus = document.activeElement && document.activeElement.id;
  const caret = focus ? document.activeElement.selectionStart : null;
  const selectionEnd = focus && document.activeElement.selectionEnd;
  const selectionDirection = focus && document.activeElement.selectionDirection;
  const active = document.activeElement;
  const control = !focus && active?.dataset?.act ? controlKey(active) : null;
  const occurrence = control ? controlsWithKey(control).indexOf(active) : -1;

  $("head").innerHTML = renderHead(STATE);
  view.innerHTML = UI.page === "main"     ? renderMain(STATE)
                 : UI.page === "history"  ? renderHistory(STATE)
                 : UI.page === "commands" ? renderCommands(STATE)
                 : UI.page === "profile"  ? renderProfile(STATE)
                 : UI.page === "others"   ? renderOthers(STATE)
                 :                          renderSettings(STATE);
  $("foot").innerHTML = UI.page === "main" ? renderFoot() : "";
  $("foot").style.display = UI.page === "main" ? "" : "none";

  // Keep the reader's place and the cursor across the 1 s rerender.
  view.scrollTop = destination ? destination.scroll : scroll;
  const target = destination
    ? (destination.control && controlsWithKey(destination.control)[destination.occurrence]) || $("page-title")
    : focus ? $(focus) : control ? controlsWithKey(control)[occurrence] : null;
  if (target && !target.disabled){
    // Replacement rows have lost :focus-within, which hides queued actions.
    // Reveal the row until focus restores that selector, including in WebKit.
    const row = target.closest?.(".job.queued");
    row?.classList.add("restoring-focus");
    target.focus({ preventScroll:true });
    row?.classList.remove("restoring-focus");
    if (!destination && caret != null) target.setSelectionRange(caret, selectionEnd, selectionDirection);
  }
  if (before) animateTaskChanges(view, before);
  if (!LIVE) renderTray(STATE);
  refreshTip();
}

const PRESSURE_TIP = {
  normal: "Memory pressure normal: jobs start when their estimate fits.",
  warn: "Memory pressure warn: a job starts only when nothing else of Headroom's is running.",
  critical: "Memory pressure critical: nothing starts, and the guard may freeze the newest job.",
};

function renderHead(S){
  const m = S.system;
  const usedPct = Math.min(100, m.mem_used / m.mem_total * 100);
  const reservePct = Math.min(100, S.settings.headroom / m.mem_total * 100);
  const color = { normal:"var(--accent)", warn:"var(--warn)", critical:"var(--bad)" }[m.pressure];
  const gaps = AGENTS.filter(([k]) => ["not_installed", "stale", "needs_review", "disabled"].includes(S.hooks[k]));
  const alert = gaps.length
    ? `<div class="alert"><span>⚠︎ ${gaps.map(([k, n]) => `${n}: ${HOOK_STATUS[S.hooks[k]][3]}`).join(". ")}.</span>
         <button data-act="goto" data-page="settings">Hook settings</button></div>`
    : "";
  return `
    <div class="row1">
      <span class="lbl">Memory</span>
      <div class="memtrack" title="Hatched: headroom kept free (${gb(S.settings.headroom)} GB)">
        <div class="fill" style="width:${usedPct}%;background:${color}"></div>
        <div class="reserve" style="width:${reservePct}%"></div>
      </div>
      <span class="memtxt num">${gb(m.mem_used)} / ${gb(m.mem_total)} GB</span>
      <button class="btn-hold ${S.held ? "on" : ""}" data-act="hold" aria-label="Hold new jobs" aria-pressed="${S.held}"
        title="${S.held ? "Start admitting jobs again" : "Stop starting new jobs; running jobs continue"}">
        ${S.held ? "Held" : "Hold"}</button>
    </div>
    <div class="row2 num">
      <span class="level ${m.pressure}" data-tip="${PRESSURE_TIP[m.pressure]}">${m.pressure.toUpperCase()}</span>
      <span data-tip="Memory macOS can hand out now without swapping. Jobs start when their estimate fits in this, minus the ${gb(S.settings.headroom)} GB kept free.">${gb(m.mem_available)} GB available</span>·
      <span data-tip="Memory moved to disk. It grows when RAM runs short; a lot of it makes everything slow.">swap ${gb(m.swap_used)} GB</span>·
      <span data-tip="CPU in use across all cores">CPU ${Math.round(m.cpu_pct)}%</span>
    </div>
    ${alert}`;
}

function renderLastDay(h){
  const bad = h.failed + h.killed;
  const cell = (value, label, tip, cls = "") => `
        <div class="${cls}" data-tip="${tip}"><b>${value}</b><span>${label}</span></div>`;
  const waits = h.waited
    ? `Of the ${h.waited} that waited. Time in the queue before starting: ${dur(h.waited_s)} in all, longest ${dur(h.longest_wait_s)}`
    : "No job had to wait";
  const share = h.waited / h.runs * 100;
  const waited = !h.waited ? "0" : share < 1 ? "&lt;1%" : `${Math.round(share)}%`;
  const ofRuns = h.waited
    ? `${h.waited} of ${h.runs}${h.more ? "+" : ""} ${h.runs === 1 ? "job" : "jobs"} waited in the queue`
    : "No job had to wait";
  return `
    <div class="sec day">
      <h2 class="sec-h">Last 24h</h2>
      <div class="day-row num">
        ${cell(`${h.runs}${h.more ? "+" : ""}`, h.runs === 1 ? "run" : "runs",
          h.more ? "History keeps 2,000 runs; more than that finished today" : "Jobs that finished", h.runs ? "" : "zero")}
        ${cell(bad, "failed", `${h.failed} exited with an error, ${h.killed} killed to free memory`, bad ? "" : "zero")}
        ${cell(waited, "waited", ofRuns, h.waited ? "" : "zero")}
        ${cell(dur(h.wait_p50_s), "wait p50", `Half the jobs that waited, waited this long or less. ${waits}`, h.wait_p50_s ? "" : "zero")}
        ${cell(dur(h.wait_p95_s), "wait p95", `95 in 100 jobs that waited, waited this long or less. ${waits}`, h.wait_p95_s ? "" : "zero")}
        ${cell(h.went_first, "went first", "Short jobs that started ahead of a bigger one waiting for memory", h.went_first ? "" : "zero")}
      </div>
    </div>`;
}

function renderMain(S){
  return `<h1 id="page-title" class="sr-only" tabindex="-1">Jobs</h1>` + S.banners.map(renderBanner).join("") + renderLastDay(S.last_day) + `
    <div class="sec">
      <h2 class="sec-h">Running ${S.running.length || ""}</h2>
      ${S.running.length
        ? S.running.map(renderRunning).join("")
        : `<div class="empty">Nothing running · ${gb(S.system.mem_available)} GB available</div>`}
    </div>
    <div class="sec" id="queue">
      <h2 class="sec-h">Queued ${S.queued.length || ""}
        ${S.queued.length && S.queue_reason
          ? `<span class="why blocked">· ${esc(reasonText(S.queue_reason))}</span>` : ""}
        ${S.queued.length && S.queued[0].skipped
          ? `<span class="why" title="Shorter jobs that fit started ahead of it. After ${S.settings.backfill_skips ?? 3} times or ${dur(S.settings.backfill_wait_s ?? 300)}, the queue waits for it.">· passed over ${S.queued[0].skipped}×${S.queued[0].strict_in_s ? ` · strict in ${dur(S.queued[0].strict_in_s)}` : ""}</span>` : ""}
      </h2>
      ${S.queued.length
        ? S.queued.map((j, i) => renderQueued(j, i, S)).join("")
        : `<div class="empty">Queue empty</div>`}
    </div>`;
}

function renderBanner(b){
  const killKey = "bkill:" + b.id;
  const acts = b.kind === "frozen" ? `
      <button class="chip-btn" data-act="resume" data-id="${b.job_id}" aria-label="Resume ${jobLabel(b)}">Resume</button>
      <button class="chip-btn ${confirming(killKey) ? "confirm" : "danger"}"
        data-act="kill" data-id="${b.job_id}" data-confirm="${killKey}" aria-label="${confirming(killKey) ? "Confirm kill" : "Kill"} ${jobLabel(b)}">
        ${confirming(killKey) ? "Kill?" : "Kill"}</button>`
    : b.kind === "requeued" ? `
      <button class="chip-btn" data-act="pin" data-id="${b.job_id}" data-on="1"
        aria-label="Pin ${jobLabel(b)}" title="Pinned jobs are never frozen or killed">Pin it</button>`
    : "";
  const title = { frozen:"Froze", requeued:"Killed and requeued", gave_up:"Gave up on" }[b.kind];
  return `
    <div class="banner ${b.kind}">
      <div class="t">${b.kind === "frozen" ? "❄︎" : "⚠︎"} ${title} “${esc(b.cmd)}” (${esc(b.label)})</div>
      <div class="d">${esc(b.why)}</div>
      ${acts ? `<div class="acts">${acts}</div>` : ""}
      <button class="x" data-act="dismiss" data-id="${b.id}" aria-label="Dismiss notice for ${jobLabel(b)}" title="Dismiss">✕</button>
    </div>`;
}

function fpBar(j){
  const range = j.memory_range;
  // A wide historical spread is evidence of variability, not a useful band
  // predicting this run. Keep its numbers in the explanation, not the rail.
  const variable = range && range.upper > range.lower * 4 && range.upper - range.lower >= GiB;
  const showBand = range && !variable;
  const scale = Math.max(j.footprint, j.estimate, range?.upper || 0, 1) * 1.15;
  const cls = j.state === "frozen" ? "frozen"
            : j.footprint > j.runaway_at ? "runaway"
            : j.footprint > j.estimate ? "over" : "";
  const past = range ? `Past peaks ${gb(range.lower)}–${gb(range.upper)} GB` : "";
  const comparable = range && (range.workers == null
    ? "with no worker count recorded"
    : `with ${range.workers} worker${range.workers === 1 ? "" : "s"}, like this job`);
  const explanation = range ? `${range.samples} successful, uninterrupted runs of this workload ${comparable}. ${variable ? `${past}. Memory varies too widely to show a useful expected band. Cached work and changing inputs can still differ for the same command.` : "The band shows the 10th to 90th percentile of past peak memory. Current usage can fall outside this range."}` : "";
  const description = `Live memory ${gb(j.footprint)} GB, shown by the fill. Conservative estimate ${gb(j.estimate)} GB, shown by the vertical tick. Runaway above ${gb(j.runaway_at)} GB.${range ? ` ${past}. ${explanation}` : ""}`;
  return `
    <div class="memory">
      <div class="fp ${cls}${showBand ? " has-range" : ""}" role="img" aria-label="${esc(description)}" title="${esc(description)}">
        ${showBand ? `<div class="range" style="left:${range.lower / scale * 100}%;width:${(range.upper - range.lower) / scale * 100}%"></div>` : ""}
        <div class="f" style="width:${j.footprint / scale * 100}%"></div>
        <div class="tick" style="left:${j.estimate / scale * 100}%"></div>
      </div>
      ${range ? `<span class="past-peaks num" data-tip="${esc(explanation)}">${variable ? "Memory varies widely" : past} · ${range.samples} runs</span>` : ""}
    </div>`;
}

function estLabel(j){
  return j.samples === 0
    ? `<span class="new" title="No successful measured runs of this workload yet. Estimate uses broader history or the default, and retains observed failed or interrupted peaks as a minimum.">new</span>est ${gb(j.estimate)} GB`
    : `est ${gb(j.estimate)} GB`;
}

function originLabel(agent){
  if (typeof agent !== "string" || !agent.trim()) return "";
  const name = agent.trim();
  switch (name.toLowerCase()) {
    case "codex": return "Codex";
    case "claude": case "claude-code": case "claude code": return "Claude Code";
    case "pi": return "pi";
    default: return name;
  }
}

/** Where it runs and which agent started it, then the command beneath. */
function jobName(j){
  const origin = originLabel(j.agent);
  return `<span class="name two" role="button" tabindex="0" aria-expanded="${UI.expanded.has(j.id)}" data-act="expand" data-id="${j.id}" title="${esc(j.full_cmd)}">
    <span class="job-title"><b>${esc(j.label)}</b>${origin ? `<span class="job-origin" title="Started by ${esc(origin)}">${esc(origin)}</span>` : ""}</span><span class="cmd">${esc(j.cmd)}</span></span>`;
}

function marks(j){
  return (j.low ? `<span class="tag" title="Low: background CPU priority, first to freeze">🐢</span>` : "")
       + (j.pinned ? `<span class="tag" title="Pinned: never frozen or killed">📌</span>` : "");
}

const jobLabel = j => esc(`${j.label}: ${j.cmd}`);

function killBtn(j){
  const key = "kill:" + j.id;
  return confirming(key)
    ? `<button class="ib kill-confirm" data-act="kill" data-id="${j.id}" data-confirm="${key}" aria-label="Confirm kill ${jobLabel(j)}">Kill?</button>`
    : `<button class="ib" data-act="kill" data-id="${j.id}" data-confirm="${key}" aria-label="Kill ${jobLabel(j)}" title="Kill (click twice)">✕</button>`;
}

function renderRunning(j){
  const frozen = j.state === "frozen";
  return `
    <div class="job ${UI.expanded.has(j.id) ? "expanded" : ""}" data-job-id="${esc(j.id)}">
      <div class="l1">
        ${jobName(j)}${marks(j)}
        <span class="mem num"><b>${gb(j.footprint)}</b> / ${estLabel(j)}</span>
      </div>
      ${j.now ? `<div class="now" title="Largest subprocess: ${esc(j.now)}">↳ ${esc(j.now)}</div>` : ""}
      ${fpBar(j)}
      <div class="l2 num">
        <span class="meta" title="Time since this attempt was admitted to run, including pauses">Elapsed ${dur(j.elapsed_s)}</span>
        ${frozen ? `<span class="meta" title="Time in the current pause">❄︎ Paused ${dur(j.frozen_s)}</span>` : ""}
        ${j.runtime_estimate_s != null ? `<span class="meta" title="The scheduler's usual runtime estimate for this attempt, not a guaranteed finish time">Usual ${dur(j.runtime_estimate_s)}</span>` : ""}
        <span class="meta">CPU ${Math.round(j.cpu_pct)}%</span>
        ${j.tuned ? `<span class="meta" title="Started with fewer workers so it fits in memory; it runs slower">${j.tuned.workers}/${j.tuned.default} workers</span>` : ""}
        <span class="acts-i">
          ${frozen
            ? `<button class="ib" data-act="resume" data-id="${j.id}" aria-label="Resume ${jobLabel(j)}" title="Resume">▶︎</button>`
            : `<button class="ib" data-act="freeze" data-id="${j.id}" aria-label="Pause ${jobLabel(j)}" title="Pause (freeze)">⏸︎</button>`}
          ${killBtn(j)}
          <button class="ib ${j.pinned ? "on" : ""}" data-act="pin" data-id="${j.id}" data-on="${j.pinned ? 0 : 1}"
            aria-label="Pin ${jobLabel(j)}" aria-pressed="${j.pinned}" title="${j.pinned ? "Unpin" : "Pin: never freeze or kill this job"}"><span class="emo">📌</span></button>
        </span>
      </div>
      ${UI.expanded.has(j.id) ? renderDetail(j) : ""}
    </div>`;
}

function renderQueued(j, i, S){
  return `
    <div class="job queued ${UI.expanded.has(j.id) ? "expanded" : ""}" data-job-id="${esc(j.id)}" data-qid="${j.id}"
      ${j.pinned ? "" : `draggable="true"`}>
      <div class="l1">
        ${j.pinned ? `<span class="handle" title="Pinned: runs next">📌</span>`

        <span class="pos num">${i + 1}</span>
        ${jobName(j)}${j.low ? marks({ low:true }) : ""}
        ${j.retry ? `<span class="tag" title="Requeued after a guard kill (retry ${j.retry}/1)">↻</span>` : ""}
        <span class="acts-i">
          <button class="ib" data-act="top" data-id="${j.id}" aria-label="Move ${jobLabel(j)} to top of queue" title="Move to top" ${i === 0 ? "disabled" : ""}>⤒</button>
          <button class="ib ${j.pinned ? "on" : ""}" data-act="pin" data-id="${j.id}" data-on="${j.pinned ? 0 : 1}"
            aria-label="Pin ${jobLabel(j)}" aria-pressed="${j.pinned}" title="${j.pinned ? "Unpin" : "Pin: run next, skip the memory check"}"><span class="emo">📌</span></button>
          <button class="ib ${j.low ? "on" : ""}" data-act="low" data-id="${j.id}" data-on="${j.low ? 0 : 1}"
            aria-label="Low priority for ${jobLabel(j)}" aria-pressed="${j.low}" title="${j.low ? "Normal priority" : "Low: background CPU priority"}"><span class="emo">🐢</span></button>

      </div>

    </div>`;
}

function schedulingText(j){
  if (j.state === "queued") {
    return j.pinned
      ? "Prioritized; skips memory checks. Still waits for queue hold, memory pressure and CPU limits. Protected from automatic pause or kill."
      : `Uses the ${gb(j.estimate)} GB memory estimate to decide whether it fits.`;
  }
  const memory = j.state === "frozen"
    ? `Keeps ${gb(j.footprint)} GB RAM while paused; no extra growth allowance. No predicted memory release while paused.`
    : j.growth_reserved != null
      ? `Allows another ${gb(j.growth_reserved)} GB for growth when starting queued jobs. Current RAM is already included in system usage.`
      : "Current RAM is already included in system usage.";
  const runtime = j.state === "frozen" ? "" : !STATE.settings.backfill
    ? " Usual runtime is historical context. Short jobs going first is turned off; jobs follow queue order."
    : j.runtime_estimate_s == null
    ? " No runtime estimate yet; cannot predict when this job frees memory."
    : j.elapsed_s >= j.runtime_estimate_s
      ? " Past its usual runtime. Queue planning allows as much time again as has elapsed; this is not a finish prediction."
      : " Usual runtime helps predict memory releases so fitting shorter jobs can go ahead in the queue.";
  return memory + runtime + (j.pinned ? " Protected from automatic pause or kill." : "");
}

function renderDetail(j){
  const origin = originLabel(j.agent);
  const queueIndex = j.state === "queued" ? STATE.queued.findIndex(x => x.id === j.id) : -1;

    ? "It helps plan when queued jobs might fit."
    : "Short jobs going first is turned off; this is historical context and jobs follow queue order.";
  return `
    <div class="detail">
      <span class="k">command</span><span class="v mono">${esc(j.full_cmd)}</span>
      <span class="k">cwd</span><span class="v mono">${esc(j.cwd)}</span>
      ${origin ? `<span class="k">agent</span><span class="v">${esc(origin)}</span>` : ""}
      <span class="k">session</span><span class="v mono">${esc(j.session || "—")}</span>
      <span class="k">profile</span><span class="v">${esc(keyLabel(j.key))} · ${j.samples} run${j.samples === 1 ? "" : "s"}</span>
      <span class="k">queue wait</span><span class="v num">${dur(j.waited_s)} ${j.state === "queued" ? "so far" : "before this attempt"}</span>
      <span class="k">usual runtime</span><span class="v num" title="The scheduler's estimate for this attempt, from previous successful, uninterrupted runs of this workload at the same recorded worker count. ${runtimeUse} It is not a guaranteed finish time.">${j.runtime_estimate_s == null ? "Unknown for this worker count" : dur(j.runtime_estimate_s)}</span>
      <span class="k">scheduling</span><span class="v">${esc(schedulingText(j))}</span>
      ${queueIndex >= 0 ? `<span class="k">queue</span><span class="v">${queueIndex === 0 && STATE.queue_reason ? esc(reasonText(STATE.queue_reason)) : `Position ${queueIndex + 1}`}</span>` : ""}
      ${j.state !== "queued" ? `

        <span class="k">processes</span><span class="v num">${j.procs}</span>
        <span class="k">peak</span><span class="v num">${gb(j.peak)} GB</span>` : ""}
      ${j.retry ? `<span class="k">retry</span><span class="v">requeued after a guard kill (${j.retry}/1)</span>` : ""}
      ${j.tuned ? `<span class="k">workers</span><span class="v">${j.tuned.workers} instead of ${j.tuned.default}, so it fits in memory</span>` : ""}

        <button class="chip-btn" data-act="profile" data-key="${esc(j.key)}">Profile</button>
      </div>
    </div>`;
}

function renderFoot(){

function pageHead(title, back = "main"){
  back = UI.trail[UI.trail.length - 1]?.page || back;
  return `<div class="pagehead"><button class="back" data-act="goto" data-page="${back}" data-back="true">‹ Back</button><h1 id="page-title" tabindex="-1">${title}</h1></div>`;
}

function outcomeTag(r){
  if (r.guard){
    const g = r.guard;
    const label = { frozen:"froze", killed:"killed", requeued:"requeued", gave_up:"gave up",
                    cancelled:"cancelled", manual_kill:"you killed", disconnected:"disconnected" }[g.action] || g.action;
    const cls = g.action === "cancelled" || g.action === "manual_kill" || g.action === "disconnected" ? "user" : "guard";
    return `<span class="gtag ${cls}" title="${esc(g.why || "")}">${label}</span>`;
  }
  return r.exit === 0 ? `<span class="gtag ok">ok</span>` : `<span class="gtag fail">exit ${r.exit}</span>`;
}

function renderHistory(S){
  return pageHead("History") + (S.history.length ? S.history.map(r => `
    <div class="hrow" role="button" tabindex="0" data-act="profile" data-key="${esc(r.key)}"${r.ended_at != null ? ` data-run="${esc(JSON.stringify([r.id, r.ended_at, r.guard?.action || null]))}"` : ""}>
      <div class="l1"><span class="name"><b>${esc(r.label)}</b> <span class="dim">· ${esc(r.cmd)}</span></span>${outcomeTag(r)}</div>
      <div class="l2 num">${dur(r.duration_s)} · peak ${gb(r.peak)} / est ${gb(r.estimate)} GB${r.tuned ? ` · ${r.tuned.workers}/${r.tuned.default} workers` : ""}${r.ahead_of ? ` · started ahead of ${esc(r.ahead_of)}` : ""} · ${ago(r.ended_ago_s)}
        ${r.guard && r.guard.why ? `<br>${esc(r.guard.why)}` : ""}</div>
    </div>`).join("") : `<div class="empty">No runs yet</div>`);
}

const CMD_SORTS = [["run_s", "Time"], ["runs", "Runs"], ["gb_h", "Memory"], ["wait_s", "Waiting"]];
/** GB-hours: a decimal while small, whole numbers past 10. */
const gbh = v => v >= 10 ? v.toFixed(0) : v >= 0.05 ? v.toFixed(1) : v > 0 ? "&lt;0.1" : "0";

/** "repo path|subdir|command" → the command in bold, where it ran after it. */
function keyName(k){
  const parts = String(k ?? "").split("|");
  const where = keyLabel(parts.slice(0, -1).join("|"));
  return `<b>${esc(parts[parts.length - 1])}</b>${where ? ` <span class="dim">· ${esc(where)}</span>` : ""}`;
}

function renderCommands(S){
  const wins = S.commands || [];
  const w = wins.find(x => x.days === UI.cmdDays) || wins[0];
  if (!w) return pageHead("Commands") + `<div class="empty">No runs yet</div>`;
  const seg = (items, cur, act) => `<span class="seg" role="group" aria-label="${act === "cmd_days" ? "Command history period" : "Sort commands by"}">${items.map(([v, l]) =>
    `<button class="${v === cur ? "on" : ""}" data-act="${act}" data-val="${v}" aria-pressed="${v === cur}" aria-label="${act === "cmd_days" ? `Last ${v} days` : `Sort by ${l.toLowerCase()}`}">${l}</button>`).join("")}</span>`;
  const controls = `<div class="cmd-ctl">
    ${seg(wins.map(x => [x.days, `${x.days}d`]), w.days, "cmd_days")}
    ${seg(CMD_SORTS, UI.cmdSort, "cmd_sort")}
  </div>`;
  if (!w.count) return pageHead("Commands") + controls + `<div class="empty">No runs in the last ${w.days} days</div>`;
  const t = w.total;
  const cell = (value, label, tip, cls = "") => `<div class="${cls}" data-tip="${tip}"><b>${value}</b><span>${label}</span></div>`;
  const key = UI.cmdSort;
  const rows = [...w.rows].sort((a, b) => b[key] - a[key] || b.run_s - a.run_s);
  const top = Math.max(...rows.map(r => r[key])) || 1;
  return pageHead("Commands") + `
    ${controls}
    <div class="day-row five num cmd-total">
      ${cell(t.runs, t.runs === 1 ? "run" : "runs", "Runs that finished, of every command")}
      ${cell(t.failed, "failed", "Exited with an error, or killed twice to free memory", t.failed ? "" : "zero")}
      ${cell(dur(t.run_s), "running", "Time the commands ran")}
      ${cell(dur(t.wait_s), "waiting", "Time in the queue before starting", t.wait_s ? "" : "zero")}
      ${cell(gbh(t.gb_h), "GB·h", "Peak memory × run time, summed: the memory held from other work")}
    </div>` + rows.map(r => `
    <div class="hrow crow" role="button" tabindex="0" data-act="profile" data-key="${esc(r.key)}">
      <div class="l1"><span class="name">${keyName(r.key)}</span>
        <span class="n num"><b>${r.runs}</b> run${r.runs === 1 ? "" : "s"}</span></div>
      <div class="cbar"><i style="width:${(r[key] / top * 100).toFixed(1)}%"></i></div>
      <div class="l2 num">${dur(r.run_s)} running · ${gbh(r.gb_h)} GB·h · peak ${gb(r.peak)} GB${
        r.wait_s ? ` · waited ${dur(r.wait_s)}` : ""}${
        r.failed ? ` · ${r.failed} failed` : ""}</div>
    </div>`).join("") + `
    <div class="cmd-note">${w.count > rows.length ? `The ${rows.length} with the most time running, of ${w.count} commands. ` : ""}Kept for ${wins[wins.length - 1].days} days. GB·h is peak memory × run time.</div>`;
}

function sparkline(peaks, p90){
  const W = 360, H = 64, pad = 4;
  // Scaled to the data's own range: from zero, run-to-run variation is a flat line.
  const hi = Math.max(...peaks, p90) * 1.08, lo = Math.min(...peaks, p90) * 0.85;
  const x = i => peaks.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (peaks.length - 1);
  const y = v => H - pad - (v - lo) / (hi - lo || 1) * (H - 2 * pad);
  const pts = peaks.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${y(p90)}" y2="${y(p90)}" stroke="var(--warn)" stroke-dasharray="4 3" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    ${peaks.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="var(--accent)"/>`).join("")}
  </svg>`;
}

function renderProfile(S){
  const p = S.profiles[UI.profileKey];
  const back = UI.profileFrom || "history";
  if (!p) return pageHead("Profile", back) + `<div class="empty">No runs recorded for this command yet.</div>`;

  return pageHead("Profile", back) + `
    <div class="prof">
      <div class="key mono" title="${esc(UI.profileKey)}">${esc(keyLabel(UI.profileKey))}</div>
      ${p.peaks.length ? sparkline(p.peaks, p.p90) : ""}
      <div class="faint" style="font-size:10.5px">Measured peaks from ${p.peaks.length} successful run${p.peaks.length === 1 ? "" : "s"} · dashed line = historical estimate</div>
      <div class="stats num">
        <div class="stat"><div class="k">historical estimate</div><div class="v">${gb(p.p90)} GB</div></div>
        <div class="stat"><div class="k">median time</div><div class="v">${p.median_s == null ? "Unknown" : dur(p.median_s)}</div></div>
        <div class="stat"><div class="k">measured runs</div><div class="v">${p.samples}</div></div>
      </div>
      <div class="faint" style="font-size:10.5px">Based on successful measured peaks and the default estimate, with failed or interrupted runs as a lower bound. Scheduling may reserve more for the command's default worker count.</div>
      ${(p.parts || []).length ? `
      <div class="parts">
        <div class="k">Runs inside it</div>
        ${p.parts.map(x => `
        <div class="part">
          <div class="mono" title="${esc(x.cmd)}">${esc(x.cmd)}</div>
          <div class="num dim">in ${x.runs} of ${p.runs} run${p.runs === 1 ? "" : "s"} · peak ${gb(x.peak)} GB · ${x.median_s == null ? "time unknown" : dur(x.median_s)}${x.procs > 1 ? ` · ${x.procs} processes` : ""}</div>
        </div>`).join("")}
      </div>` : ""}
      <div style="margin-top:14px">
        <button class="chip-btn ${confirming(key) ? "confirm" : "danger"}" data-act="reset_profile"
          data-key="${esc(UI.profileKey)}" data-confirm="${esc(key)}">
          ${confirming(key) ? "Reset? Click again" : "Reset profile"}</button>
        <span class="faint" style="font-size:11px;margin-left:6px">Next run uses broader history or the default estimate.</span>
      </div>
    </div>`;
}

function renderOthers(S){
  const max = Math.max(1, ...S.others.map(o => o.bytes));
  // The apps below add up to the first figure. The second is the rest of
  // memory in use: macOS, apps too small to list, and Headroom's own jobs.
  // Footprints count compressed memory, so the apps can exceed "in use".
  const apps = S.others.reduce((n, o) => n + o.bytes, 0);
  const rest = Math.max(0, S.system.mem_used - apps);
  const total = `
    <div class="ototal num"><span>Other apps</span><b>${gb(apps)} GB</b><span class="sep"></span>
      <span title="macOS, apps too small to list, and Headroom's jobs">System</span><b>${gb(rest)} GB</b></div>`;
  return pageHead("Other apps") + total + S.others.map(o => {
    const open = UI.openApps.has(o.name);
    const top = o.top || [];
    return `
    <div class="orow ${open ? "open" : ""}">
      <div class="l1 num"><span class="name" role="button" tabindex="0" aria-expanded="${open}" data-act="expand_app" data-name="${esc(o.name)}">${esc(o.name)}</span>
        <span class="dim">${o.procs} proc${o.procs === 1 ? "" : "s"}</span><b>${gb(o.bytes)} GB</b></div>
      <div class="bar"><div style="width:${o.bytes / max * 100}%"></div></div>
      ${open ? `<div class="odetail">
        ${o.path ? `<div class="where mono">${esc(o.path)}</div>` : ""}
        ${top.map(p => `<div class="oproc">
          <div class="l1 num"><span class="dim">pid ${p.pid}</span><span style="flex:1"></span><b>${gb(p.bytes)} GB</b></div>
          <div class="cmd mono" title="${esc(p.cmd)}">${esc(p.cmd)}</div>
          ${p.cwd ? `<div class="k">in <span class="mono">${esc(p.cwd)}</span></div>` : ""}
          ${p.started_by.length ? `<div class="k">started by ${p.started_by.map(esc).join(" › ")}</div>` : ""}
        </div>`).join("")}
        ${o.procs > top.length ? `<div class="k" style="margin-top:6px">and ${o.procs - top.length} smaller</div>` : ""}
      </div>` : ""}
    </div>`;
  }).join("") + `
    <div class="note-foot">Not managed: the scheduler never pauses or kills these. They count toward
      memory in use, so they affect when queued jobs can start.</div>`;
}

const KILL_MODES = [
  ["off", "Off", "Never pause or kill. Under pressure, jobs just stay queued."],
  ["freeze", "Freeze", "Pause the newest low-priority job under critical pressure. Never kills."],
  ["freeze_kill", "Freeze + kill", "Freeze first; if pressure stays critical, kill and requeue it once."],
];

function stepper(key, label, value, step, fmt, min, max){
  return `<span class="stepper num" role="group" aria-label="${label}">
    <button data-act="set" data-key="${key}" data-step="down" aria-label="Decrease ${label.toLowerCase()}" data-val="${Math.max(min, value - step)}" ${value <= min ? "disabled" : ""}>−</button>
    <span>${fmt(value)}</span>
    <button data-act="set" data-key="${key}" data-step="up" aria-label="Increase ${label.toLowerCase()}" data-val="${Math.min(max, value + step)}" ${value >= max ? "disabled" : ""}>+</button>
  </span>`;
}

function renderSettings(S){
  const c = S.settings;
  const installs = AGENTS.filter(([k]) => ["not_installed", "stale"].includes(S.hooks[k]));
  const codexCheck = ["needs_review", "review_unknown", "disabled"].includes(S.hooks.codex);

    : !v ? `<div class="verdict no">…</div>`
    : v.result === "heavy" ? `<div class="verdict yes">✓ gated, command type <span class="mono">${esc(v.key)}</span></div>`

  return pageHead("Settings") + `
    <div class="set">
      <div class="k">Headroom</div>
      <div class="h">Memory kept free before a new job may start.</div>
      <div class="ctl">${stepper("headroom", "Headroom", c.headroom, 0.5 * GiB, b => gb(b) + " GB", 0, Math.max(16 * GiB, Math.floor(S.system.mem_total / GiB) * GiB / 2))}</div>

      <div class="h">How long an agent's command waits in the queue before it's told to retry. Background commands wait as long as needed.</div>
      <div class="ctl">${stepper("wait_cap_s", "Foreground wait limit", c.wait_cap_s, 60, s => Math.round(s / 60) + " min", 60, 540)}</div>
    </div>
    <div class="set">
      <div class="k">Default estimate</div>
      <div class="h">Assumed for a command with no history yet.</div>
      <div class="ctl">${stepper("default_estimate", "Default estimate", c.default_estimate, 0.5 * GiB, b => gb(b) + " GB", 0.5 * GiB, 16 * GiB)}</div>
    </div>
    <div class="set">
      <div class="k">Heavy commands</div>
      <div class="h">Commands matching these are queued. Dashed ones are long-lived and never queued.</div>
      <div class="pats mono">
        ${c.patterns.map(p => `<span class="pat">${esc(p)}<button data-act="remove_pattern" data-pattern="${esc(p)}" aria-label="Remove pattern ${esc(p)}" title="Remove">✕</button></span>`).join("")}
        ${c.excluded.map(p => `<span class="pat excl" title="Long-lived: not queued">${esc(p)}</span>`).join("")}
      </div>
      <div class="ctl">
        <label class="sr-only" for="patIn">New heavy command pattern</label>
        <input class="txt mono" id="patIn" placeholder="add pattern, e.g. bun test" value="${esc(UI.drafts.pattern)}" data-draft="pattern">

      </div>
      ${verdict}
    </div>
    <div class="set">
      <div class="ctl" style="margin-top:0;justify-content:space-between">

/* ═══════════════════════════════════════════════════════════
   5. Menu bar item (POC preview)
   Rust draws the real one; this is the reference it ports:
   4 segments filled by memory used, coloured only off-normal
   (template image while normal), title = running·queued.
   ═══════════════════════════════════════════════════════════ */
function trayModel(S){
  const segs = Math.max(0, Math.min(4, Math.round(S.system.mem_used / S.system.mem_total * 4)));
  const frozen = S.running.some(j => j.state === "frozen");
  const n = S.running.length, q = S.queued.length;
  const title = ((n || q) ? `${n}·${q}` : "") + (frozen ? " ❄︎" : "") + (S.held ? " ⏸︎" : "");
  return { segs, level: S.system.pressure, title };
}

function renderTray(S){
  const t = trayModel(S);
  const dark = $("darkBar").checked;
  $("menubar").classList.toggle("dark", dark);
  const ink = t.level === "critical" ? "#ef4444" : t.level === "warn" ? "#f59e0b" : (dark ? "#f2f2f7" : "#1c1c1e");
  const cv = $("trayGlyph"), g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < 4; i++){
    const x = 2 + i * 8, w = 6, h = 24, y = 4;
    g.globalAlpha = i < t.segs ? 1 : .28;
    g.fillStyle = ink;
    g.beginPath(); g.roundRect(x, y, w, h, 2); g.fill();
  }
  g.globalAlpha = 1;
  $("trayTitle").textContent = t.title;
  $("trayTitle").style.color = t.level === "normal" ? "" : ink;
}

/* ═══════════════════════════════════════════════════════════
   6. Events — one delegated listener; elements carry data-act
   ═══════════════════════════════════════════════════════════ */
$("pop").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const d = t.dataset, id = d.id;

  if (d.confirm && !confirming(d.confirm)){ armConfirm(d.confirm); render(); return; }
  if (d.confirm) UI.confirm = null;

  switch (d.act){
    case "goto":    navigate(d.page, t, d.back === "true"); return;
    case "expand":  UI.expanded.has(id) ? UI.expanded.delete(id) : UI.expanded.add(id); break;
    case "expand_app": UI.openApps.has(d.name) ? UI.openApps.delete(d.name) : UI.openApps.add(d.name); break;
    case "profile": UI.profileFrom = UI.page === "main" || UI.page === "commands" ? UI.page : "history";
                    UI.profileKey = d.key; navigate("profile", t); return;
    case "snippet": UI.snippet = !UI.snippet; break;
    case "cmd_days": UI.cmdDays = Number(d.val); break;
    case "cmd_sort": UI.cmdSort = d.val; break;
    case "hold":    send({ cmd:"hold", on: !STATE.held }); return;
    case "freeze": case "resume": case "kill": case "cancel": case "top":
                    send({ cmd: d.act, id }); return;
    case "pin": case "low":
                    send({ cmd: d.act, id, on: d.on === "1" }); return;
    case "dismiss": send({ cmd:"dismiss", id }); return;
    case "copy":    send({ cmd:"copy", text: d.text }); return;
    case "reset_profile": send({ cmd:"reset_profile", key: d.key }); return;
    case "set": {
      const v = d.val === "true" ? true : d.val === "false" ? false
              : isNaN(Number(d.val)) ? d.val : Number(d.val);
      send({ cmd:"set", key: d.key, value: v }); return;
    }
    case "add_pattern": {
      const p = UI.drafts.pattern.trim();
      if (p){ UI.drafts.pattern = ""; send({ cmd:"add_pattern", pattern: p }); }
      return;
    }
    case "remove_pattern": send({ cmd:"remove_pattern", pattern: d.pattern }); return;
    case "quit":    send({ cmd:"quit" }); return;
  }
  render();
});

$("pop").addEventListener("input", (e) => {
  const k = e.target.dataset.draft;
  if (!k) return;
  UI.drafts[k] = e.target.value;

  if (k === "test" && e.target.value.trim()) send({ cmd:"classify", text: e.target.value });

$("pop").addEventListener("keydown", (e) => {

/* Drag to reorder. Pinned rows sit above every unpinned row, so a drop
   is clamped to just below the last pinned one. */
function dropIndex(e){
  const rows = [...document.querySelectorAll("[data-qid]")];
  const over = e.target.closest("[data-qid]");
  if (!over) return null;
  const i = rows.indexOf(over);
  const r = over.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  return { over, after, to: i + (after ? 1 : 0) };
}
function clearDropMarks(){
  document.querySelectorAll(".drop-before,.drop-after").forEach(n => n.classList.remove("drop-before", "drop-after"));
}
/* The tooltip follows the element under the pointer, found again after each
   redraw: the numbers it explains change every second, and the element it
   was opened on is replaced by the redraw. */
const POINTER = { x: null, y: null };
function showTip(t){
  const tip = $("tip");
  if (!t){ tip.classList.remove("on"); return; }
  tip.textContent = t.dataset.tip;
  tip.classList.add("on");
  // Below the element, or above it near the bottom; never past the sides.
  const r = t.getBoundingClientRect(), box = $("pop").getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(box.left + 6, Math.min(r.left + r.width / 2 - w / 2, box.right - w - 6)) + "px";
  tip.style.top = (r.bottom + 6 + h <= box.bottom ? r.bottom + 6 : r.top - h - 6) + "px";
}
function refreshTip(){
  if (POINTER.x == null || !document.elementFromPoint) return;
  const el = document.elementFromPoint(POINTER.x, POINTER.y);
  showTip(el && el.closest ? el.closest("[data-tip]") : null);
}
$("pop").addEventListener("mousemove", (e) => {
  POINTER.x = e.clientX; POINTER.y = e.clientY;
  showTip(e.target.closest && e.target.closest("[data-tip]"));
});
$("pop").addEventListener("mouseleave", () => { POINTER.x = null; $("tip").classList.remove("on"); });

$("pop").addEventListener("dragstart", (e) => {
  const row = e.target.closest("[data-qid]");
  if (!row) return;
  clearTaskMotion();
  UI.drag = { id: row.dataset.qid };
  row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", row.dataset.qid);
});
$("pop").addEventListener("dragover", (e) => {
  if (!UI.drag) return;
  const d = dropIndex(e);
  if (!d) return;
  e.preventDefault();
  clearDropMarks();
  d.over.classList.add(d.after ? "drop-after" : "drop-before");
});
$("pop").addEventListener("drop", (e) => {
  if (!UI.drag) return;
  e.preventDefault();
  const d = dropIndex(e);
  const id = UI.drag.id;
  UI.drag = null;
  clearDropMarks();
  if (!d) return render();
  const from = STATE.queued.findIndex(j => j.id === id);
  const pinned = STATE.queued.filter(j => j.pinned).length;
  // Removing the row first shifts every later index up by one.
  let to = d.to > from ? d.to - 1 : d.to;
  to = Math.max(pinned, to);
  if (to === from) return render();
  send({ cmd:"move", id, to });
});
$("pop").addEventListener("dragend", () => {
  if (UI.drag){ UI.drag = null; clearDropMarks(); render(); }
});

    const j = J.jest(); j.state = "running"; j.footprint = G(2.3); j.peak = G(2.4); j.elapsed_s = 38; j.cpu_pct = 240; j.procs = 6;
    return base({ running:[J.vitest(), j], queued:[J.build()],
      queue_reason:{ kind:"memory", need:G(2.0), free:G(1.4) } });
  } },
  held: { title:"Held", desc:"you paused admissions", make: () => base({
    held:true, running:[J.tsc()], queued:[J.e2e(), J.build(), J.jest()],
    queue_reason:{ kind:"held" } }) },
  nohook: { title:"Hooks missing + CPU", desc:"Codex needs review, pi missing; CPU-bound", make: () => base({
    hooks:{ claude:"installed", codex:"needs_review", pi:"not_installed" },
    system:{ pressure:"normal", mem_total:G(36), mem_used:G(20.3), mem_available:G(15.7), swap_used:G(0), cpu_pct:97 },
    running:[J.vitest()], queued:[J.build()],
    queue_reason:{ kind:"cpu", load:16, cores:10 } }) },
};

let CURRENT = new URLSearchParams(location.search).get("state");
if (!MOCK[CURRENT]) CURRENT = "busy";

function load(k){
  CURRENT = k;
  STATE = MOCK[k].make();
  UI.page = "main"; UI.expanded.clear(); UI.confirm = null;
  history.replaceState(null, "", "?state=" + k);
  renderPoc(); render();
}

function logSent(m){
  const box = $("sent");
  box.textContent = JSON.stringify(m) + "\n" + box.textContent;
}

/** Mock classifier for the preview only. Rust's classify.rs is the real one. */
function mockClassify(text){
  const s = STATE.settings;
  const ex = s.excluded.find(p => new RegExp(`(^|\\s)${p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(\\s|$)`).test(text));
  if (ex) return { text, result:"excluded", why: ex };
  const hit = s.patterns.find(p => text.includes(p));
  if (!hit) return { text, result:"light" };
  return { text, result:"heavy", key: hit };
}

function mockApply(m){
  logSent(m);
  const S = STATE;
  const all = () => [...S.running, ...S.queued];
  const find = id => all().find(j => j.id === id);
  const reorderPinned = () => {
    S.queued = [...S.queued.filter(j => j.pinned), ...S.queued.filter(j => !j.pinned)];
  };
  switch (m.cmd){
    case "hold":
      S.held = m.on;
      S.queue_reason = m.on ? { kind:"held" } : (S.queued.length ? { kind:"memory", need:S.queued[0].estimate, free:G(2.9) } : null);
      break;
    case "freeze": { const j = find(m.id); if (j){ j.state = "frozen"; j.frozen_s = 0; j.cpu_pct = 0; } break; }
    case "resume": {
      const j = find(m.id); if (j){ j.state = "running"; j.cpu_pct = 150; }
      S.banners = S.banners.filter(b => b.job_id !== m.id || b.kind !== "frozen");
      break;
    }
    case "kill": {
      const j = S.running.find(x => x.id === m.id);
      if (j){
        S.running = S.running.filter(x => x !== j);
        S.history.unshift({ id:"r" + Date.now(), label:j.label, cmd:j.cmd, key:j.key, duration_s:j.elapsed_s,
          peak:j.peak, estimate:j.estimate, exit:null, ended_ago_s:0, guard:{ action:"manual_kill", why:"killed from menu bar" } });
      }
      S.banners = S.banners.filter(b => b.job_id !== m.id);
      break;
    }
    case "cancel": {
      const j = S.queued.find(x => x.id === m.id);
      S.queued = S.queued.filter(x => x.id !== m.id);
      if (j) S.history.unshift({ id:"r" + Date.now(), label:j.label, cmd:j.cmd, key:j.key, duration_s:0,
        peak:0, estimate:j.estimate, exit:null, ended_ago_s:0, guard:{ action:"cancelled", why:"cancelled from menu bar" } });
      break;
    }
    case "top": {
      const i = S.queued.findIndex(j => j.id === m.id);
      if (i > 0){ const [j] = S.queued.splice(i, 1); S.queued.unshift(j); reorderPinned(); }
      break;
    }
    case "move": {
      const i = S.queued.findIndex(j => j.id === m.id);
      if (i >= 0){ const [j] = S.queued.splice(i, 1); S.queued.splice(m.to, 0, j); reorderPinned(); }
      break;
    }
    case "pin": { const j = find(m.id); if (j){ j.pinned = m.on; reorderPinned(); }
      if (m.on) S.banners = S.banners.filter(b => b.job_id !== m.id || b.kind !== "requeued");
      break; }
    case "low": { const j = find(m.id); if (j) j.low = m.on; break; }
    case "dismiss": S.banners = S.banners.filter(b => b.id !== m.id); break;
    case "reset_profile": delete S.profiles[m.key]; all().forEach(j => { if (j.key === m.key){ j.samples = 0; j.memory_range = null; j.estimate = S.settings.default_estimate; } }); break;
    case "set": S.settings[m.key] = m.value; break;
    case "add_pattern": if (!S.settings.patterns.includes(m.pattern)) S.settings.patterns.push(m.pattern); break;
    case "remove_pattern": S.settings.patterns = S.settings.patterns.filter(p => p !== m.pattern); break;
    case "classify": S.classify = mockClassify(m.text); break;
    case "copy": case "quit": return;
  }
  render();
}

function renderPoc(){
  const box = $("stateList");
  box.innerHTML = "";
  Object.entries(MOCK).forEach(([k, v]) => {
    const b = document.createElement("button");
    b.className = "st" + (k === CURRENT ? " on" : "");
    b.innerHTML = `${v.title}<small>${v.desc}</small>`;
    b.onclick = () => load(k);
    box.append(b);
  });
}

if (!LIVE){
  $("darkBar").checked = matchMedia("(prefers-color-scheme: dark)").matches;
  $("darkBar").addEventListener("change", () => renderTray(STATE));
  load(CURRENT);
  // Make time pass so timers and footprints look alive, as they will at 1 Hz.
  setInterval(() => {
    if (!STATE) return;
    STATE.running.forEach(j => {
      j.elapsed_s++;
      if (j.state === "frozen") j.frozen_s++;
    });
    STATE.queued.forEach(j => j.waited_s++);
    render();
  }, 1000);
}
</script>
